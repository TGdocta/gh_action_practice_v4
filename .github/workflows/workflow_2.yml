name: workflow_2

on:
    push:
        branches:
            - main
            - dev
env:
    APP_NAME: ${{ vars.APP_NAME}}
    APP_VERSION: ${{ vars.APP_VERSION}}
    DB_NAME: ${{ secrets.DB_NAME}}
    DB_PASSWORD: ${{ secrets.DB_PASSWORD}}
    DB_PORT: ${{ secrets.DB_PORT}}
jobs:
    tests:
        runs-on: ubuntu-24.04
        steps:
            - name: OBTENER_CODIGO
              uses: actions/checkout@v7
            - name: INSTALAR_NODE
              uses: actions/setup-node@v7
              with:
                node-version: '24'
            - name: INSTALAR_DEPENDENCIAS
              run: npm ci
            - name: EJECUTAR TESTS
              run: npm test
    lint:
        runs-on: ubuntu-24.04
        steps:
            - name: OBTENER_CODIGO
              uses: actions/checkout@v7
            - name: INSTALAR_NODE
              uses: actions/setup-node@v7
              with:
                node-version: '24'
            - name: INSTALAR_DEPENDENCIAS
              run: npm ci
            - name: EJECUTAR LINTER
              run: npm run lint
    deploy:
        needs: [lint,tests]
        runs-on: ubuntu-24.04
        steps:
            - name: OBTENER_CODIGO
              uses: actions/checkout@v7
            - name: INSTALAR_NODE
              uses: actions/setup-node@v7
              with:
                node-version: '24'
            - name: INSTALAR_DEPENDENCIAS
              run: npm ci
            - name: run build
              run: | 
                echo "
                Repository: ${{ github.repository }}
                Branch: ${{github.repository.branches }}
                Actor: ${{github.actor }} 
                Application: ${{vars.APP_NAME}} -  ${{vars.APP_VERSION}}
                Database Password Exists ✔"


        